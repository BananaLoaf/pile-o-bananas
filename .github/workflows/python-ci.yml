name: Python CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs lint, typecheck and test on every push
  python-ci:
    uses: BananaLoaf/ci-cd/.github/workflows/python-ci.yml@master
    with:
      mypy-options: pile_o_bananas/

  # Build python package if python-ci is OK. Runs on tags v*, push or PRs to master
  python-build:
    uses: BananaLoaf/ci-cd/.github/workflows/python-build.yml@master
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.base_ref == 'master'
    name: python-build
    needs: python-ci
    with:
      cibuildwheel: false

  # Releases built python package on tags v*
  python-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: python-publish
    needs: python-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          ignore-empty-workdir: true

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish
